<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相愛沒有那麼茸易｜鹿場經營遊戲</title>
<style>
:root{--bg:#f4efe2;--ink:#1f2a22;--green:#1f3a2c;--wine:#6b1e2b;--line:#1f2a2255;--mute:#5a6258;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16201a;--ink:#efe8d6;--green:#a9c4ac;--wine:#e08a97;--line:#efe8d655;--mute:#b5b9a8}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.8 "Noto Serif TC","Songti TC","PMingLiU",serif;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .35 0 0 0 0 .3 0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
main{max-width:880px;margin:0 auto;padding:20px 20px 60px}
h1,h2,h3{font-weight:900;line-height:1.25;margin:0}
.kicker{font:700 13px/1.4 system-ui,sans-serif;letter-spacing:.25em;color:var(--wine);text-transform:uppercase}
.rule{border:0;border-top:2px solid var(--ink);margin:18px 0}.thin{border-top:1px solid var(--line)}
.hero h1{font-size:clamp(44px,12vw,104px);color:var(--green);letter-spacing:.02em;margin:14px 0 6px}
.hero h2{font-size:clamp(20px,4.5vw,30px);color:var(--wine);font-weight:600}
.btn{display:block;width:100%;min-height:56px;padding:14px 18px;margin:12px 0;font:inherit;font-weight:700;text-align:left;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:0;cursor:pointer}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--bg);outline:none}
.btn.go{background:var(--green);color:var(--bg);text-align:center;border-color:var(--green)}
.btn.go:hover{background:var(--wine);border-color:var(--wine);color:#fff}
.btn small{display:block;font-weight:400;opacity:.8}
.btn .k{font-family:system-ui,sans-serif;color:var(--wine);margin-right:8px}
.btn:hover .k{color:inherit}
.top{display:flex;justify-content:space-between;align-items:baseline;font:600 14px system-ui,sans-serif;gap:10px}
.prog{display:flex;gap:4px;margin:8px 0}.prog i{flex:1;height:5px;background:var(--line)}.prog i.on{background:var(--wine)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font:600 14px system-ui,sans-serif;margin:8px 0 4px}
.stat .bar{height:6px;border:1px solid var(--ink);margin-top:3px}.stat .bar b{display:block;height:100%;background:var(--green)}
.stat .d{color:var(--wine)}
.scene{font-size:clamp(22px,4.5vw,30px);margin:18px 0 8px;color:var(--green)}
.tag{display:inline-block;border:1px solid var(--wine);color:var(--wine);padding:0 10px;font:700 13px/1.8 system-ui,sans-serif;margin-right:6px}
.note{border-left:4px solid var(--wine);padding:2px 0 2px 14px;margin:18px 0;font-size:16px;color:var(--mute)}
.know{background:var(--green);color:var(--bg);padding:16px 18px;margin:18px 0}
.know b{display:block;font:700 13px system-ui,sans-serif;letter-spacing:.2em;margin-bottom:4px}
.fine{font-size:14px;color:var(--mute)}
.deltas{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font:700 15px system-ui,sans-serif}
.cols{display:grid;gap:22px}@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}
textarea{width:100%;min-height:90px;font:inherit;padding:10px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:0}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
label.opt input{width:24px;height:24px;margin-top:5px;accent-color:var(--wine);flex:none}
svg.art{width:100%;max-width:420px;display:block;margin:10px auto;color:var(--green)}
a{color:var(--wine)}.link{background:none;border:0;font:inherit;font-size:14px;text-decoration:underline;color:var(--mute);cursor:pointer;padding:8px 0}
</style></head><body><main id="app"></main>
<script>
const S={funds:"經營資金",care:"鹿隻照護",qual:"生產與品質管理",trust:"消費者信任"},K=Object.keys(S);
const EV=[
{t:"第一週・接手鹿場",s:"前任鹿農把鑰匙與一疊紀錄本交給你，鹿群在晨霧裡抬頭看你。你想先從哪裡開始？",
 o:[{x:"先跟著老鹿農巡場，建立鹿群個體紀錄",d:[-3,6,6,3],r:"你花了一週觀察採食、行走與長茸狀況，並開始記錄每隻鹿。短期沒有收入，但後面每個決定都有依據。"},
    {x:"立刻擴大鹿群，增加產量",d:[-12,-6,0,0],r:"新增的鹿需要更多草料、空間與照顧人力，場內管理開始吃緊，資金也快速流出。"},
    {x:"先四處拜訪通路，確認誰會收茸",d:[-4,0,0,3],m:1,r:"你認識了幾位可能的合作對象，但對自家鹿群的狀況仍不夠熟悉。"}],
 k:"鹿茸是公鹿頭上「生長中」的角，外覆絨毛皮膚、富含血液供應；之後會逐漸骨化，成為堅硬的鹿角。兩者不是同一種東西。個體紀錄與種鹿系譜，也是畜產試驗所輔導產業選育的重要基礎。"},
{t:"第二季・飼料與成本",s:"草料價格波動，帳本上的數字讓你皺眉。鹿群每天都要吃，你要怎麼安排？",
 o:[{x:"與草農簽約，契作穩定品質的牧草",d:[-6,6,6,0],r:"每月支出較高，但草料品質與供應比較穩定，鹿群狀況也更好掌握。"},
    {x:"一律改買最便宜的飼料",d:[8,-8,-6,0],r:"帳面暫時好看，但營養與採食狀況不穩，鹿隻與茸的品質都受到影響。"},
    {x:"小規模試驗不同配方，並逐項記錄結果",d:[-4,3,4,0],r:"你把成本、採食與生長狀況一起記下，慢慢找到適合自己鹿場的搭配。"}],
 k:"降低飼養成本、提升鹿茸產量是產業長期的課題。農業政府資料提到過牧草分級、與草農契作等方向。成本要降，但不能靠犧牲營養與照護。"},
{t:"夏末・鹿隻異常",s:"巡場時，有一隻鹿食慾下降、行動遲緩，離群站在角落。",
 o:[{x:"隔離觀察、詳細記錄，並請獸醫診斷",d:[-6,10,2,2],r:"獸醫協助釐清原因，你也學到哪些徵兆要及早通報。花了一筆診療費，但問題被及早處理。"},
    {x:"先照網路偏方處理，等兩週再看看",d:[4,-12,-4,-4],r:"省了眼前的錢，但拖延讓狀況惡化，也可能影響整個鹿群。這是遊戲裡最需要避免的選擇。"},
    {x:"獸醫診斷後，再全面檢視鹿群衛生與防疫",d:[-12,12,6,4],r:"花費最高，但你同時補強了衛生管理與檢查流程，鹿群與日後的產品都更有保障。"}],
 k:"鹿隻出現異常，應優先觀察、隔離並尋求獸醫或專業人員協助，不應自行判斷或用藥。官方資料也指出，加強鹿隻結核病檢查與預防，有助確保國產鹿茸的品質與衛生安全。"},
{t:"茸期・採收決定",s:"今年的茸長得漂亮，買家也在詢問。採收前，你要怎麼準備？",
 o:[{x:"依專業人員指導與動物福利規範，安排訓練過的人員與流程",d:[-8,6,8,4],r:"準備時間較長，但鹿隻壓力較低、紀錄完整，採收品質也更穩定。"},
    {x:"趕訂單，省略準備與確認步驟",d:[6,-8,-8,-3],r:"短期趕上了交期，但鹿隻承受不必要的壓力，品質與紀錄也出現落差。"},
    {x:"延後一批，請教專家與同業改善流程",d:[-4,4,5,2],r:"你損失一部分時效，但學到更適合場內的做法。"}],
 k:"鹿茸採收涉及動物福利與專業操作，本遊戲不示範操作步驟。農業政府資料曾提及研發更人道的採收技術，以提升產業形象。實際作業請依專業規範與主管機關要求。"},
{t:"秋季・加工與通路",s:"鹿茸收下來了，你要怎麼把它變成消費者看得懂、買得安心的產品？",
 o:[{x:"依不同產品分別評估加工方式，並清楚標示內容與保存方式",d:[-7,0,6,6],m:1,r:"你理解到不同產品的處理與保存並不相同，資訊清楚，消費者較能理解。"},
    {x:"所有產品套用同一套做法與說明",d:[5,0,-6,-4],r:"流程簡單，但不同產品的特性被忽略，標示也不夠精確。"},
    {x:"與在地通路合作，推廣鮮茸與產地故事",d:[-3,0,2,6],m:1,r:"消費者能看見產地與生產者，產生信任，但通路經營也需要時間。"}],
 k:"鹿茸有鮮茸、乾燥品與各式加工產品等多種形式，不同產品加工方式與保存條件並不一樣。業界與畜試所也在開發多元化的加工產品，讓消費族群更廣。"},
{t:"年末・市場與信任",s:"進口鹿茸價格較低，網路上也有人用誇大宣傳搶客。你的店要怎麼說話？",
 o:[{x:"在文案寫「保證治病」，快速吸引買家",d:[10,0,0,-14],r:"短期詢問增加，但缺乏可靠證據的宣稱，會傷害消費者信任，也可能有法規風險。"},
    {x:"誠實說明：鹿茸與骨化鹿角不同，研究仍在累積，不宣稱療效，並公開產地與生產紀錄",d:[-2,0,3,10],r:"成交速度不一定最快，但消費者看得懂也信得過。"},
    {x:"直接降價，跟進口產品拚價格",d:[6,-4,-5,-4],r:"銷量暫時回升，但利潤變薄，壓縮照護與品質的空間。"}],
 k:"依臺紐經濟合作協定，2025 年起紐西蘭鹿茸零關稅進口，國內產業面臨價格競爭。業界與政府的因應方向包括品牌、產地認證與開拓市場。目前相關研究只是在持續累積，鹿茸不應被宣傳為治病用途。"}];
const END={
reset:{n:"需要重新調整經營策略",c:"某些面向已經亮起紅燈。",b:"這是學習的起點：回頭看看是哪個環節被忽略，例如資金、照護、品質或信任。鹿場經營靠整體平衡，不是單一指標。"},
quality:{n:"重視品質與信任的鹿場",c:"你選擇慢慢來，把品質與信任放在前面。",b:"你重視紀錄、照護與誠實標示，在價格競爭下靠品質與信任站穩腳步。代價是資金需要更精打細算。"},
market:{n:"市場開發型鹿場",c:"你把握機會，開拓了通路與產品。",b:"你多次選擇開發產品或通路，也維持了基本的信任與資金。市場的機會來自於清楚的產品資訊與對消費者的誠信。"},
stable:{n:"穩定經營的鹿場",c:"各面向大致平衡，沒有明顯短板。",b:"你在成本、照護與市場之間取得了平衡。接下來可以思考：要在哪個方向再往前一步？"}};
const REF=[["農業部畜產試驗所／食力 foodnext：臺紐經濟合作協定與養鹿產業因應","https://www.foodnext.net/science/technology/paper/5357997798"],["農業部：鹿茸產業政策與因應（moa.gov.tw）","https://www.moa.gov.tw/ws.php?id=1004"],["公視新聞：開放紐西蘭鹿茸零關稅進口","https://news.pts.org.tw/article/713519"],["農業知識庫（畜產試驗所）：高產茸鹿評選","https://agrkb.angrin.tlri.gov.tw/modules/smartsection/makepdf.php?itemid=765"]];
let g,fb=[],$=document.getElementById("app");
const reset=()=>g={sc:"home",i:0,st:{funds:75,care:60,qual:50,trust:50},log:[],mk:0,last:null,lock:false,f:{}};reset();
const bar=()=>`<div class="stats">${K.map(k=>`<div class="stat">${S[k]} <b>${g.st[k]}</b>${g.last?` <span class="d">${fmt(g.last.dd[k])}</span>`:""}<div class="bar"><b style="width:${g.st[k]}%"></b></div></div>`).join("")}</div>`;
const fmt=v=>v>0?`▲+${v}`:v<0?`▼${v}`:"－0";
const antler=c=>`<svg class="art" viewBox="0 0 200 160" role="img" aria-label="鹿茸與鹿角線條示意圖（非真實照片）" fill="none" stroke="currentColor" stroke-width="2"><path d="M100 150V90M100 90C80 80 62 60 50 20M100 90C120 80 138 60 150 20M76 70C60 66 48 54 42 44M124 70C140 66 152 54 158 44M66 52C56 50 48 40 46 30M134 52C144 50 152 40 154 30"/><circle cx="100" cy="150" r="3" fill="currentColor"/><text x="100" y="159" font-size="7" text-anchor="middle" fill="currentColor" stroke="none">示意圖｜非真實照片</text></svg>`;
function ending(){const s=g.st,v=K.map(k=>s[k]);if(s.funds<=15||Math.min(...v)<=25||v.filter(x=>x<35).length>=2)return"reset";if(s.qual+s.trust>=125&&s.care>=55)return"quality";if(g.mk>=2&&s.funds>=35&&s.trust>=50)return"market";return"stable"}
function choose(i){if(g.lock||g.sc!=="ev")return;g.lock=true;const o=EV[g.i].o[i],dd={};K.forEach((k,j)=>{const n=Math.max(0,Math.min(100,g.st[k]+o.d[j]));dd[k]=n-g.st[k];g.st[k]=n});if(o.m)g.mk++;g.last={o,dd,e:EV[g.i]};g.log.push({e:EV[g.i].t,x:o.x,w:o.d.reduce((a,b)=>a+Math.abs(b),0),r:o.r});g.sc="fb";g.lock=false;render()}
function next(){if(g.sc!=="fb")return;g.last=null;g.i++;g.sc=g.i>=EV.length?"end":"ev";render();scrollTo(0,0)}
function go(s){g.sc=s;render();scrollTo(0,0)}
function head(){return`<div class="top"><span>相愛沒有那麼茸易</span><span>事件 ${Math.min(g.i+1,EV.length)}／${EV.length}</span></div><div class="prog">${EV.map((_,j)=>`<i class="${j<g.i||(g.sc==="fb"&&j===g.i)?"on":""}"></i>`).join("")}</div>`}
function render(){let h="";const sc=g.sc;
if(sc==="home")h=`<div class="hero"><div class="kicker">農業傳播展｜互動鹿場日誌</div><hr class="rule"><h1>相愛沒有<br>那麼茸易</h1><h2>但認識鹿茸，可以很容易。</h2><hr class="rule thin"><p>一座鹿場、一本紀錄本與一群看著你的鹿。你將做出一連串經營決定，看看台灣養鹿產業的取捨。</p><button class="btn go" onclick="go('intro')">開始經營</button><button class="link" onclick="go('refs')">知識說明與參考資料</button></div>`;
else if(sc==="intro")h=`<div class="kicker">角色與任務</div><h2 class="scene">你是剛接手鹿場的新手養鹿人</h2><p>接下來約有十二個事件，還可能遇到隱藏事件。你前面的選擇會影響後面發生的事。每次選擇都有好處，也有代價。沒有永遠最好的答案。</p><div class="cols"><div>${K.map(k=>`<p><b>${S[k]}</b><br><span class="fine">${{funds:"撐起日常開銷與投資。",care:"鹿隻的健康與福利。",qual:"飼養、採收與加工的紀錄與品質。",trust:"消費者與通路對你的信賴。"}[k]}</span></p>`).join("")}</div><div class="note">數值與結局都是遊戲設計用的模擬，<b>不是真實產業統計</b>。遊戲情境是虛構的；知識說明才是現實資訊。</div></div><button class="btn go" onclick="go('ev')">走進鹿場</button>`;
else if(sc==="ev"){const e=EV[g.i];h=head()+bar()+`<hr class="rule thin"><div class="kicker">${e.t}</div><h2 class="scene">${e.s}</h2>${e.o.map((o,j)=>`<button class="btn" onclick="choose(${j})"><span class="k">${"ABC"[j]}</span>${o.x}</button>`).join("")}`}
else if(sc==="fb"){const l=g.last;h=head()+bar()+`<hr class="rule thin"><div class="kicker">你選擇了</div><h2 class="scene">${l.o.x}</h2><p>${l.o.r}</p><div class="know"><b>產業知識</b>${l.e.k}</div><button class="btn go" onclick="next()">${g.i>=EV.length-1?"看結局":"繼續經營"}</button>`}
else if(sc==="end"){const k=ending(),E=END[k],top=[...g.log].sort((a,b)=>b.w-a.w)[0];h=`<div class="kicker">結局</div><hr class="rule"><h1 style="color:var(--wine);font-size:clamp(30px,8vw,56px)">${E.n}</h1><p>${E.c}</p>${antler()}${bar()}<div class="cols"><div><h3>為什麼是這個結局</h3><p>${E.b}</p><p class="fine">本結局依整趟旅程累積的四項指標與選擇傾向判定，而非只看最後一題。</p></div><div><h3>最關鍵的決策</h3><p>「${top.e}」：${top.x}。<br><span class="fine">${top.r}</span></p></div></div><div class="know"><b>帶走的知識</b>鹿茸是生長中的角，與已骨化的鹿角不同；不同產品加工方式也不同；鹿隻異常應尋求獸醫協助；誠實的資訊與紀錄，是建立信任的基礎。鹿茸研究持續累積中，不應宣稱未經證實的療效。</div><button class="btn go" onclick="go('fbk')">留下參觀回饋</button><button class="btn" onclick="reset();go('home')">再玩一次</button>`}
